[package]
name = "berenice"
version = "0.1.0"
edition = "2021"
authors = ["Hades Core Team"]
description = "Lightweight cross-platform client and multi-input engine for Project Hades"
license = "MIT OR Apache-2.0"
default-run = "berenice"

[dependencies]
hades-core = { path = "../hades-core" }
hades-net = { path = "../hades-net" }
hades-ro-prere = { path = "../hades-ro-prere" }
hades-styx = { path = "../hades-styx" }
hades-world = { path = "../hades-world" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
bytes = "1.0"
flate2 = "1.0"
minifb = "0.27"
gilrs = "0.10"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"



