[package]
name = "hades-net"
version = "0.1.0"
edition = "2021"
authors = ["Hades Core Team"]
description = "Modern WebTransport / QUIC network transport layer with unreliable datagrams and multiplexed reliable streams for Hades Engine"
license = "MIT OR Apache-2.0"

[dependencies]
hades-core = { path = "../hades-core" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.14"
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
thiserror = "1.0"
bytes = "1.0"
