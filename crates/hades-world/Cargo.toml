[package]
name        = "hades-world"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
description = "Servidor Mundial (World Server) do Hades — Simulação espacial, AoI e movimento em tempo real"

[[bin]]
name = "hades-world"
path = "src/main.rs"

[lib]
name = "hades_world"
path = "src/lib.rs"

[dependencies]
hades-core     = { path = "../hades-core" }
hades-net      = { path = "../hades-net" }
hades-ro-prere = { path = "../hades-ro-prere" }

# Async & Transport
tokio             = { version = "1", features = ["full"] }
quinn             = "0.11"
tokio-tungstenite = "0.26"
futures-util      = "0.3"
bytes             = "1"

# JSON (wire protocol)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# GRF decompression
flate2 = "1.0"

# Erros / logs / env
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy            = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
